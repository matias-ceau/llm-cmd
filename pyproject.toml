[project]
name = "quipcli"
version = "0.4.0"
description = "Minimal LLM CLI — ask questions, run AI-generated shell commands, optional fzf-based --tui"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["argcomplete"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
qp = "quipcli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
